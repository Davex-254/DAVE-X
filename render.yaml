services:
  - type: web
    name: davex-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: davex-db
          property: connectionString

databases:
  - name: davex-db
    plan: free